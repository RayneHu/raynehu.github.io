<body class="bg-[#fafafa] text-gray-900 dark:bg-[#0a0a0a] dark:text-gray-100 font-sans antialiased selection:bg-black selection:text-white dark:selection:bg-white dark:selection:text-black w-full h-[100dvh] relative overflow-hidden">

    <!-- 核心约束容器 -->
    <div id="app-container" class="fixed top-[10vh] bottom-[25vh] left-0 right-0 flex flex-col w-full max-w-4xl mx-auto z-10">
        
        <!-- Global Top Bar -->
        <header id="top-bar" class="border-b-[1px] border-gray-200 dark:border-gray-800 p-1.5 sm:p-2 shrink-0 flex justify-between items-center bg-inherit z-50 relative bg-white/80 dark:bg-[#0a0a0a]/80 backdrop-blur-md">
            <!-- 极简高级的艺术化标题，带有协调的装饰图案 -->
            <div class="flex items-center gap-1.5 sm:gap-2 shrink-0 ml-1 opacity-90 select-none">
                <span class="text-[10px] sm:text-[12px] opacity-40 text-gray-600 dark:text-gray-400 font-serif">✦</span>
                <h1 style="font-family: 'Didot', 'Bodoni MT', 'Times New Roman', serif;" class="text-[13px] sm:text-[15px] font-bold tracking-[0.35em] uppercase drop-shadow-sm leading-none mt-[2px]">Texas Hold'em</h1>
                <span class="text-[10px] sm:text-[12px] opacity-40 text-gray-600 dark:text-gray-400 font-serif">✦</span>
            </div>
            
            <div class="flex items-center justify-end flex-wrap gap-1.5 sm:gap-2 overflow-visible">
                <span id="ui-stage-text" class="text-[8px] uppercase tracking-widest opacity-50 font-mono hidden sm:inline-block">LOBBY</span>
                
                <button id="btn-return-lobby" onclick="app.returnToLobby()" class="hidden items-center gap-0.5 text-[8px] sm:text-[9px] font-mono tracking-widest uppercase px-1.5 py-1 border-[1px] border-gray-400 dark:border-gray-600 opacity-50 hover:opacity-100 hover:bg-gray-200 dark:hover:bg-gray-800 transition-all rounded-md shrink-0">
                    <svg class="w-2.5 h-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    <span id="txt-btn-lobby">返回</span>
                </button>

                <!-- RPG Save System Button -->
                <button onclick="app.toggleSavePanel()" class="flex items-center opacity-70 hover:opacity-100 transition p-1 text-[8px] sm:text-[9px] font-mono tracking-widest uppercase border-[1px] border-gray-300 dark:border-gray-700 rounded-md shrink-0">
                    <svg class="w-3 h-3 mr-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                    <span id="txt-btn-save">存档</span>
                </button>

                <!-- 音效菜单按钮 -->
                <div class="relative flex items-center">
                    <button onclick="app.toggleSoundPanel(event)" class="flex items-center opacity-70 hover:opacity-100 transition p-1 text-[8px] sm:text-[9px] font-mono tracking-widest uppercase border-[1px] border-gray-300 dark:border-gray-700 rounded-md shrink-0">
                        <span id="txt-btn-sound">🔇 OFF</span>
                    </button>
                    <div id="sound-panel" class="hidden absolute top-full right-0 mt-2 bg-white dark:bg-[#111] border-[1px] border-gray-300 dark:border-gray-700 rounded-md shadow-xl z-50 flex-col p-1 w-[85px] sm:w-[95px]">
                        <!-- 动态生成 -->
                    </div>
                </div>
                
                <button onclick="app.toggleLang()" class="flex items-center gap-0.5 opacity-70 hover:opacity-100 transition p-1 text-[8px] sm:text-[9px] font-mono tracking-widest uppercase shrink-0">
                    <span id="lang-display">ZH</span>
                </button>

                <!-- 主题颜色菜单按钮 -->

                    <button onclick="app.toggleThemePanel(event)" class="opacity-70 hover:opacity-100 transition p-1 shrink-0">
                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
                    </button>
                    <div id="theme-panel" onclick="event.stopPropagation()" class="hidden absolute top-full right-0 mt-2 bg-white dark:bg-[#111] border-[1px] border-gray-300 dark:border-gray-700 rounded-md shadow-xl z-50 grid grid-cols-4 gap-2 p-2 w-[140px] sm:w-[150px]">

    <div id="custom-confirm" class="hidden fixed inset-0 z-[110] flex items-center justify-center bg-black/60 backdrop-blur-sm transition-opacity">

                <button id="btn-confirm-ok" onclick="app.executeConfirm()" class="flex-1 rounded-md px-4 py-2 bg-red-600 hover:bg-red-500 text-white border-[1px] border-red-600 text-xs font-bold uppercase tracking-widest transition-colors">确定</button>

    <script>
        // --- Save Manager System ---
        const saveManager = {
            slots: new Array(8).fill(null),
            selectedSlot: null,
            init() {
                try {
                    const saved = localStorage.getItem('texasholdem_saves');
                    if (saved) {
                        this.slots = JSON.parse(saved);
                    }
                } catch (e) {}
            },
            selectSlot(idx) {
                this.selectedSlot = idx;
                this.renderSlots();
            },
            renderSlots() {
                const container = document.getElementById('save-slots-container');
                if (!container) return;
                let html = '';
                this.slots.forEach((slot, idx) => {
                    const isSelected = this.selectedSlot === idx;
                    const borderClass = isSelected ? 'border-blue-500 shadow-[0_0_8px_rgba(59,130,246,0.5)] ring-1 ring-blue-500 scale-[1.02] z-10' : 'border-gray-300 dark:border-gray-700 hover:border-gray-400 dark:hover:border-gray-500 opacity-80 hover:opacity-100';
                    const bgClass = isSelected ? 'bg-blue-50/50 dark:bg-blue-900/20' : 'bg-transparent';

                    if (!slot) {
                        html += `
                        <button onclick="saveManager.selectSlot(${idx})" class="w-full text-left p-2 sm:p-3 rounded-md border-[1px] transition-all flex flex-col items-center justify-center min-h-[4rem] sm:min-h-[4.5rem] relative ${borderClass} ${bgClass}">
                            <span class="absolute top-1 left-1.5 text-[8px] font-mono opacity-40 font-bold text-black dark:text-white">0${idx + 1}</span>
                            <span class="text-[9px] sm:text-[10px] font-mono font-bold opacity-40 text-center uppercase tracking-widest text-black dark:text-white">${t('slotEmpty')}</span>
                        </button>`;
                    } else {
                        html += `
                        <button onclick="saveManager.selectSlot(${idx})" class="w-full text-left p-2 sm:p-3 rounded-md border-[1px] transition-all flex flex-col justify-between min-h-[4rem] sm:min-h-[4.5rem] relative overflow-hidden ${borderClass} ${bgClass}">
                            <span class="absolute top-1 left-1.5 text-[8px] font-mono opacity-50 font-bold text-black dark:text-white">0${idx + 1}</span>
                            <div class="w-full flex justify-between items-center mt-2.5">
                                <span class="text-[9px] sm:text-[10px] font-mono font-bold truncate pr-1 text-black dark:text-white opacity-80">${slot.timestamp}</span>
                                <span class="text-[10px] sm:text-[11px] font-mono text-yellow-600 dark:text-yellow-500 font-bold shrink-0 drop-shadow-sm">💰 ${slot.players[0].chips}</span>
                            </div>
                            <div class="text-[7.5px] sm:text-[8px] font-mono opacity-60 mt-1 truncate w-full uppercase tracking-wider text-black dark:text-white">
                                VS: ${slot.selectedAIs.join(', ')}
                            </div>
                        </button>`;
                    }
                });
                container.innerHTML = html;

                const btnSave = document.getElementById('btn-save-action');
                const btnLoad = document.getElementById('btn-load-action');
                if (this.selectedSlot !== null) {
                    btnSave.disabled = false; btnSave.classList.remove('opacity-30', 'cursor-not-allowed');
                    if (this.slots[this.selectedSlot]) {
                        btnLoad.disabled = false; btnLoad.classList.remove('opacity-30', 'cursor-not-allowed');
                    } else {
                        btnLoad.disabled = true; btnLoad.classList.add('opacity-30', 'cursor-not-allowed');
                    }
                } else {
                    btnSave.disabled = true; btnSave.classList.add('opacity-30', 'cursor-not-allowed');
                    btnLoad.disabled = true; btnLoad.classList.add('opacity-30', 'cursor-not-allowed');
                }
            },
            actionSave() {
                if (this.selectedSlot === null) return;
                if (!game.isActive) {
                    app.showConfirm(t('msgMustInGame'), null);
                    document.getElementById('btn-confirm-cancel').classList.add('hidden');
                    document.getElementById('btn-confirm-ok').innerText = "OK";
                    return;
                }

                const executeSave = () => {
                    const s = game.state;
                    const data = {
                        timestamp: new Date().toLocaleString(app.lang === 'zh' ? 'zh-CN' : (app.lang === 'ja' ? 'ja-JP' : 'en-US'), {hour12: false}),
                        players: s.players.map(p => ({
                            id: p.id,
                            name: p.name,
                            isBot: p.isBot,
                            chips: s.stage === 4 ? p.chips : p.chips + p.roundBet, // Properly save mid-hand economy
                            rebuyCount: p.rebuyCount
                        })),
                        selectedAIs: app.selectedAIs
                    };
                    this.slots[this.selectedSlot] = data;
                    try { localStorage.setItem('texasholdem_saves', JSON.stringify(this.slots)); } catch(e){}
                    this.renderSlots();
                };

                if (this.slots[this.selectedSlot]) {
                    app.showConfirm(t('msgSaveConfirm'), () => { executeSave(); });
                } else {
                    executeSave();
                }
            },
            actionLoad() {
                if (this.selectedSlot === null || !this.slots[this.selectedSlot]) return;
                app.showConfirm(t('msgLoadConfirm'), () => {
                    const data = this.slots[this.selectedSlot];
                    app.selectedAIs = data.selectedAIs;
                    
                    // Reconstruct players
                    game.state.players = data.players.map(p => {
                         const profile = p.isBot ? AI_PROFILES.find(ai => ai.name === p.name) : null;
                         return { ...p, profile, bet: 0, roundBet: 0, cards: [], folded: false, hasRaisedThisRound: false, status: '' };
                    });
                    
                    game.isActive = true;
                    
                    // UI transitions
                    document.getElementById('save-modal').classList.add('hidden');
                    document.getElementById('lobby-view').style.display = 'none';
                    document.getElementById('btn-return-lobby').classList.remove('hidden');
                    document.getElementById('btn-return-lobby').classList.add('flex');
                    const gameView = document.getElementById('game-view');
                    gameView.style.display = 'flex';
                    gameView.style.opacity = '1';
                    
                    // Reset and start
                    game.state.dealerIndex = 0;
                    app.updateUIStrings();
                    game.startHand();
                });
            },
            exportData() {
                const dataStr = JSON.stringify(this.slots, null, 2);
                const blob = new Blob([dataStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
                a.download = `TexasHoldemPro_Saves_${dateStr}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            },
            importData(event) {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const imported = JSON.parse(e.target.result);
                        if (Array.isArray(imported) && imported.length === 8) {
                            this.slots = imported;
                            localStorage.setItem('texasholdem_saves', JSON.stringify(this.slots));
                            this.selectedSlot = null;
                            this.renderSlots();
                            app.showConfirm(t('msgImportSuccess'), null);
                            document.getElementById('btn-confirm-cancel').classList.add('hidden');
                            document.getElementById('btn-confirm-ok').innerText = "OK";
                        } else {
                            throw new Error("Invalid format");
                        }
                    } catch(err) {
                        app.showConfirm(t('msgImportFail'), null);
                        document.getElementById('btn-confirm-cancel').classList.add('hidden');
                        document.getElementById('btn-confirm-ok').innerText = "OK";
                    }
                };
                reader.readAsText(file);
                event.target.value = ''; // Reset input to allow re-importing the same file
            }
        };

        // --- 极致古典优雅 立体声音效系统 ---
        const soundManager = {
            enabled: false,
            style: 'classic', // classic, anime, flow, rock, rnb, jazz, chinese, lofi
            ctx: null,
            masterGain: null,
            delayNode: null,
            init() { 
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                        this.masterGain = this.ctx.createGain();
                        this.masterGain.gain.value = 0.8;
                        this.masterGain.connect(this.ctx.destination);

                        // 古典大厅宽阔的混响
                        this.delayNode = this.ctx.createDelay();
                        this.delayNode.delayTime.value = 0.3; 
                        const feedback = this.ctx.createGain();
                        feedback.gain.value = 0.3; 
                        const filter = this.ctx.createBiquadFilter();
                        filter.type = 'lowpass';
                        filter.frequency.value = 1200; 

                        this.delayNode.connect(feedback);
                        feedback.connect(filter);
                        filter.connect(this.delayNode);
                        this.delayNode.connect(this.masterGain);
                    }
                }
            },
            toggle() { 
                this.enabled = !this.enabled; 
                if (this.enabled) {
                    this.init(); 
                    if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
                }
                app.renderPanels();
            },
            playClassical(freq, type, duration, vol, pan, useDelay=false, attack=0.015) {
                if (!this.enabled || !this.ctx) return;
                try {
                    const t = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    let panner;
                    
                    if (this.ctx.createStereoPanner) {
                        panner = this.ctx.createStereoPanner();
                        panner.pan.value = pan;
                    } else {
                        panner = this.ctx.createGain(); 
                    }

                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, t);

                    gain.gain.setValueAtTime(0, t);
                    gain.gain.linearRampToValueAtTime(vol, t + attack);
                    gain.gain.setTargetAtTime(0, t + attack, duration / 3); // 自然原声乐器衰减感

                    osc.connect(gain);
                    gain.connect(panner);
                    panner.connect(this.masterGain);
                    if (useDelay && this.delayNode) {
                        panner.connect(this.delayNode);
                    }

                    osc.start(t);
                    osc.stop(t + duration * 2);
                } catch(e){}
            },
            playCard() { 
                const s = this.style;
                const pan = Math.random() > 0.5 ? 0.3 : -0.3;
                if (s === 'anime') { this.playClassical(880, 'square', 0.05, 0.01, pan); }
                else if (s === 'flow') { this.playClassical(659.25, 'sine', 0.2, 0.02, pan, true, 0.05); }
                else if (s === 'rock') { this.playClassical(110, 'sawtooth', 0.05, 0.02, pan); }
                else if (s === 'rnb') { this.playClassical(523.25, 'triangle', 0.1, 0.02, pan, false, 0.02); }
                else if (s === 'jazz') { this.playClassical(440, 'sine', 0.1, 0.02, pan, false, 0.01); }
                else if (s === 'chinese') { this.playClassical(392, 'sine', 0.2, 0.02, pan, true, 0.01); }
                else if (s === 'lofi') { this.playClassical(220, 'sine', 0.4, 0.015, pan, true, 0.1); }
                else {
                    this.playClassical(440.0, 'sine', 0.1, 0.03, pan, false, 0.005);
                    setTimeout(() => this.playClassical(554.37, 'triangle', 0.1, 0.02, -pan, false, 0.005), 50);
                }
            },
            playAction(type) {
                if (!this.enabled || !this.ctx) return;
                const s = this.style;
                if (s === 'anime') {
                    const w = 'square';
                    if (type === 'fold') { this.playClassical(330, w, 0.1, 0.02, 0); setTimeout(()=>this.playClassical(165, w, 0.2, 0.02, 0), 80); }
                    else if (type === 'check') this.playClassical(880, w, 0.05, 0.02, 0);

            setMaxRaise() { 
                const s = this.state; const p = s.players[0]; const toCall = s.currentBet - p.roundBet; 
                const blindAmt = s.players.length === 2 ? 200 : (s.players.length === 3 ? 100 : (s.players.length === 4 ? 50 : 20)); let minR = toCall + blindAmt; const maxBet = s.players.length === 2 ? 500 : (s.players.length === 3 ? 400 : (s.players.length === 4 ? 300 : 200)); let maxR = Math.min(maxBet - p.roundBet, p.chips); 
                if (maxR < minR) return; 
                s.raiseInputVal = maxR; 
                document.getElementById('raise-val').innerText = s.raiseInputVal; 
                if(document.getElementById('btn-raise-sub100')) document.getElementById('btn-raise-sub100').disabled = (s.raiseInputVal <= minR);
                document.getElementById('btn-raise-sub').disabled = (s.raiseInputVal <= minR); 
                if(document.getElementById('btn-raise-sub50')) document.getElementById('btn-raise-sub50').disabled = (s.raiseInputVal <= minR);
                document.getElementById('btn-raise-add').disabled = true; 
                if(document.getElementById('btn-raise-add50')) document.getElementById('btn-raise-add50').disabled = true;
                if(document.getElementById('btn-raise-add100')) document.getElementById('btn-raise-add100').disabled = true;
                const btnMax = document.getElementById('btn-raise-max'); 
                if (btnMax) btnMax.disabled = true; 
            },
            humanAction(type) { const s = this.state; if (s.players[s.turnIndex].id !== 0) return; let raiseAmt = 0; if (type === 'raise') { if (s.players[0].hasRaisedThisRound) return; raiseAmt = s.raiseInputVal - (s.currentBet - s.players[0].roundBet); } document.getElementById('action-bar').classList.add('opacity-50', 'pointer-events-none'); this.applyAction(0, type, raiseAmt); },
            applyAction(playerId, type, raiseAmt = 0) {
                if (!this.isActive) return; const s = this.state; const p = s.players[playerId]; const toCall = s.currentBet - p.roundBet;
                if (type === 'fold') { p.folded = true; p.status = 'Fold'; this.log(t('logFold', {name: p.name})); soundManager.playAction('fold'); this.updateOdds(); } 
                else if (type === 'call') { const actual = this.deductBet(playerId, toCall); p.status = toCall === 0 ? 'Check' : 'Call'; p.hasRaisedThisRound = true; if(toCall === 0) { this.log(t('logCheck', {name: p.name})); soundManager.playAction('check'); } else { this.log(t('logCall', {name: p.name, amt: actual})); soundManager.playAction('call'); } } 
                else if (type === 'raise') { const actual = this.deductBet(playerId, toCall + raiseAmt); p.status = 'Raise'; p.hasRaisedThisRound = true; s.lastActionIndex = playerId; this.log(t('logRaise', {name: p.name, amt: raiseAmt})); soundManager.playAction('raise'); }
                s.turnIndex = (s.turnIndex + 1) % s.players.length; this.processTurn();
            },
            nextStage() {
                if (!this.isActive) return; const s = this.state; s.stage++; s.players.forEach(p => { p.bet = 0; p.roundBet = 0; p.status = ''; p.hasRaisedThisRound = false; }); s.currentBet = 0; s.turnIndex = (s.dealerIndex + 1) % s.players.length; while(s.players[s.turnIndex].folded || s.players[s.turnIndex].chips === 0) { s.turnIndex = (s.turnIndex + 1) % s.players.length; if (s.turnIndex === (s.dealerIndex + 1) % s.players.length) break; } s.lastActionIndex = (s.turnIndex === 0 ? s.players.length - 1 : s.turnIndex - 1); if (s.stage === 1) { s.communityCards.push(s.deck.pop(), s.deck.pop(), s.deck.pop()); this.log(t('logFlop')); soundManager.playCard(); } else if (s.stage === 2) { s.communityCards.push(s.deck.pop()); this.log(t('logTurn')); soundManager.playCard(); } else if (s.stage === 3) { s.communityCards.push(s.deck.pop()); this.log(t('logRiver')); soundManager.playCard(); } else if (s.stage === 4) { this.handleShowdown(); return; } this.updateOdds(); this.render(); setTimeout(() => { if (this.isActive) this.processTurn(); }, 600);
            },
            endHandEarly() { if (!this.isActive) return; const s = this.state; s.stage = 4; const winner = s.players.find(p => !p.folded); winner.chips += s.pot; s.winners = [winner]; s.winningHandIdx = -1; this.log(t('logEarlyWin', {name: winner.name, pot: s.pot})); soundManager.playWin(); this.renderShowdown(); },
            handleShowdown() { if (!this.isActive) return; const s = this.state; const active = s.players.filter(p => !p.folded); let bestScore = -1; let winners = []; active.forEach(p => { const handInfo = getBestHandInfo([...p.cards, ...s.communityCards]); p.score = handInfo.score; p.best5 = handInfo.best5; if (p.score > bestScore) { bestScore = p.score; winners = [p]; } else if (p.score === bestScore) winners.push(p); }); const winAmount = Math.floor(s.pot / winners.length); winners.forEach(w => { w.chips += winAmount; }); s.winners = winners; s.winningHandIdx = bestScore >> 20; s.winningCardKeys.clear(); winners.forEach(w => { w.best5.forEach(c => s.winningCardKeys.add(`${c.r}-${c.s}`)); }); const winNames = winners.map(w => w.name).join(', '); const handName = T[app.lang].ranks[s.winningHandIdx] || T[app.lang].ranks[0]; this.log(t('logShowdown', {names: winNames, pot: winAmount, hand: handName})); soundManager.playWin(); this.renderShowdown(); },
            render() {
                if (!this.isActive) return; const s = this.state; document.getElementById('ui-stage-text').innerText = t('stage' + s.stage); const centerContainer = document.getElementById('center-board-container');
                if (s.stage === 4) {
                    let winnerRows = `<div class="flex flex-wrap justify-center gap-4 sm:gap-6 w-full mb-0.5">`; s.winners.forEach(w => { winnerRows += `<div class="flex flex-col items-center"><span class="text-[9px] sm:text-[10px] font-mono font-bold text-[#78350f] dark:text-[#facc15] mb-1">${w.name} (+${Math.floor(s.pot/s.winners.length)})</span><div class="flex justify-center -space-x-2">${this.renderCard(w.cards[0], true, s.winningCardKeys.has(`${w.cards[0].r}-${w.cards[0].s}`))} ${this.renderCard(w.cards[1], true, s.winningCardKeys.has(`${w.cards[1].r}-${w.cards[1].s}`))}</div></div>`; }); winnerRows += `</div>`;
                    let commHTML = `<div class="flex justify-center gap-0.5 sm:gap-1 mt-1">`; for(let i=0; i<5; i++) { let c = s.communityCards[i]; commHTML += this.renderCard(c, true, c ? s.winningCardKeys.has(`${c.r}-${c.s}`) : false, 'large'); } commHTML += `</div>`;
                    const handNameStr = s.winningHandIdx === -1 ? (app.lang === 'zh' ? '无人跟注获胜' : app.lang === 'en' ? 'WIN BY FOLD' : '他者フォールド') : (T[app.lang].ranks[s.winningHandIdx] || T[app.lang].ranks[0]);
                    centerContainer.innerHTML = `<div class="w-full max-w-lg flex flex-col items-center gap-0.5 p-2 rounded-lg border-[1px] border-yellow-500/30 bg-yellow-500/5 dark:bg-yellow-500/10 shadow-lg relative pt-3 z-10 backdrop-blur-sm"><div class="absolute -top-2 px-2 bg-[#fafafa] dark:bg-[#0a0a0a] text-[8px] sm:text-[9px] uppercase font-bold text-[#78350f] dark:text-yellow-400 tracking-[0.2em] flex items-center gap-1 border-[1px] border-yellow-500/30 rounded-full py-0 shadow-sm"><span>🏆 WINNER</span></div>${winnerRows}<div class="text-[10px] sm:text-[11px] font-bold text-[#78350f] dark:text-[#facc15] tracking-widest uppercase mt-0.5 mb-0.5 animate-pulse drop-shadow-md">✦ ${handNameStr} ✦</div><div class="text-[7px] uppercase opacity-40 mt-0 mb-0 tracking-widest">${t('community')}</div>${commHTML}</div>`;
                } else {
                    let commHTML = `<div class="flex justify-center gap-0.5 sm:gap-1 h-16 sm:h-24 mt-0.5">`; for(let i=0; i<5; i++) commHTML += this.renderCard(s.communityCards[i], true, false, 'large'); commHTML += `</div>`;
                    centerContainer.innerHTML = `<div class="text-center relative z-10"><p id="txt-pot-label" class="text-[8px] sm:text-[9px] uppercase tracking-widest opacity-50 font-mono mb-0">${t('pot')}</p><p class="text-2xl sm:text-3xl font-mono font-bold tracking-tighter leading-none" id="ui-pot">${s.pot}</p></div><div class="relative z-10">${commHTML}</div>`;
                }
                const humanContainer = document.getElementById('human-player-container'); 
                
                let oddsBtnText = app.showOdds ? `<span class="text-green-600 dark:text-green-400">${t('oddsOn')}</span>` : `<span>${t('oddsOff')}</span>`;
                let oddsBtn = `<button onclick="app.toggleOdds()" class="flex items-center justify-center border-[1.5px] border-gray-400 dark:border-gray-600 rounded-full px-2.5 sm:px-3 py-1 opacity-80 hover:opacity-100 hover:scale-105 active:scale-95 transition-all shadow-md text-[8px] sm:text-[9px] tracking-widest shrink-0 font-bold bg-white dark:bg-[#111] ${app.showOdds ? 'border-green-500/50 dark:border-green-500/50 ring-2 ring-green-500/20' : ''}">
                    ${oddsBtnText}
                </button>`;

                let oddsDisplay = ''; 
                if (app.showOdds && s.myOdds !== null && s.stage < 4) { 
                    const oddsVal = typeof s.myOdds === 'number' ? s.myOdds.toFixed(1) + '%' : s.myOdds; 
                    const colorClass = s.players[0].folded ? 'text-[#7d9e85] dark:text-[#6b8e73]' : 'text-green-600 dark:text-green-400';
                    oddsDisplay = `<div class="absolute bottom-full mb-1 left-1/2 -translate-x-1/2 w-max text-sm sm:text-lg font-mono font-bold ${colorClass} drop-shadow-md leading-none animate-pulse">${oddsVal}</div>`; 
                }

                let oddsSection = `<div class="relative flex flex-col items-center justify-center mt-3 sm:mt-4">${oddsDisplay}${oddsBtn}</div>`;

                humanContainer.innerHTML = `<div class="w-full flex items-center justify-center relative z-10"><div class="flex-1 flex justify-end items-center"></div><div class="shrink-0 relative">${this.renderPlayerBox(s.players[0], s.turnIndex === 0, true)}</div><div class="flex-1 flex justify-start items-center ml-3 sm:ml-5">${oddsSection}</div></div>`;
                
                const aiContainer = document.getElementById('ai-players-container'); aiContainer.innerHTML = ''; for(let i=1; i<s.players.length; i++) aiContainer.innerHTML += this.renderPlayerBox(s.players[i], s.turnIndex === i, false);
                const actionBar = document.getElementById('action-bar'); if (s.stage === 4) { actionBar.classList.remove('opacity-50', 'pointer-events-none'); document.getElementById('btn-fold').parentElement.classList.add('hidden'); document.getElementById('raise-container').classList.add('hidden'); document.getElementById('next-hand-container').classList.remove('hidden'); }
                else if (s.turnIndex !== 0 || s.players[0].folded) actionBar.classList.add('opacity-50', 'pointer-events-none');
            },
            renderShowdown() { this.render(); },
            updateHumanControls(p) {
                const s = this.state; const actionBar = document.getElementById('action-bar'); actionBar.classList.remove('opacity-50', 'pointer-events-none'); document.getElementById('btn-fold').parentElement.classList.remove('hidden'); document.getElementById('raise-container').classList.remove('hidden'); document.getElementById('next-hand-container').classList.add('hidden');
                const toCall = s.currentBet - p.roundBet; const btnCall = document.getElementById('btn-call'); if (toCall === 0) btnCall.innerText = t('btnCheck'); else btnCall.innerText = `${t('btnCall').split(' ')[0]} ${toCall}`;
                const blindAmt = s.players.length === 2 ? 200 : (s.players.length === 3 ? 100 : (s.players.length === 4 ? 50 : 20)); let minR = toCall + blindAmt; const maxBet = s.players.length === 2 ? 500 : (s.players.length === 3 ? 400 : (s.players.length === 4 ? 300 : 200)); let maxR = Math.min(maxBet - p.roundBet, p.chips);
                const btnRaise = document.getElementById('btn-raise'); 
                const btnSub100 = document.getElementById('btn-raise-sub100'); 
                const btnSub = document.getElementById('btn-raise-sub'); 
                const btnSub50 = document.getElementById('btn-raise-sub50');
                const btnAdd = document.getElementById('btn-raise-add'); 
                const btnAdd50 = document.getElementById('btn-raise-add50');
                const btnAdd100 = document.getElementById('btn-raise-add100');
                const btnMax = document.getElementById('btn-raise-max'); 
                const raiseVal = document.getElementById('raise-val');
                
                if (p.hasRaisedThisRound || maxR < minR || p.chips <= toCall) { 
                    s.raiseInputVal = 0; raiseVal.innerText = p.hasRaisedThisRound ? 'MAX(1/1)' : 'MAX'; 
                    btnSub.disabled = true; if(btnSub50) btnSub50.disabled = true; if(btnSub100) btnSub100.disabled = true;
                    btnAdd.disabled = true; if(btnAdd50) btnAdd50.disabled = true; if(btnAdd100) btnAdd100.disabled = true;
                    btnRaise.disabled = true; if(btnMax) btnMax.disabled = true; 
                }
                else { 
                    btnRaise.disabled = false; s.raiseInputVal = minR; raiseVal.innerText = s.raiseInputVal; 
                    btnSub.disabled = true; if(btnSub50) btnSub50.disabled = true; if(btnSub100) btnSub100.disabled = true;
                    btnAdd.disabled = (s.raiseInputVal >= maxR); if(btnAdd50) btnAdd50.disabled = (s.raiseInputVal >= maxR); if(btnAdd100) btnAdd100.disabled = (s.raiseInputVal >= maxR);
                    if(btnMax) btnMax.disabled = (s.raiseInputVal >= maxR); 
                }
            },
            renderCard(card, faceUp = false, isWinningCard = false, size = 'normal') { 
                let sizeClass = size === 'large' ? 'w-10 h-14 sm:w-14 sm:h-20' : 'w-7 h-10 sm:w-10 sm:h-14';
                let txtClass = size === 'large' ? 'text-[14px] sm:text-[18px]' : 'text-[12px] sm:text-[14px]';
                let iconClass = size === 'large' ? 'text-[20px] sm:text-[28px]' : 'text-[16px] sm:text-[20px]';

                if (!card) return `<div class="${sizeClass} border-[1px] border-dashed border-gray-400 dark:border-gray-600 opacity-30 flex items-center justify-center rounded-md shrink-0"></div>`; 
                if (!faceUp) return `<div class="card-enter ${sizeClass} border-[1.5px] border-solid border-black dark:border-white bg-gray-200 dark:bg-gray-800 rounded-md shadow-sm relative z-10 shrink-0"></div>`; 
                let colorClass = 'text-black dark:text-white'; 
                if (card.s === 'h') colorClass = 'text-red-600 dark:text-red-500'; 
                else if (card.s === 'd') colorClass = 'text-[#9d174d] dark:text-[#f472b6]'; 
                else if (card.s === 'c') colorClass = 'text-[#1e3a8a] dark:text-[#60a5fa]'; 
                const winClass = isWinningCard ? 'ring-2 sm:ring-[3px] ring-yellow-500 scale-110 z-20 shadow-lg' : 'relative z-10'; 
                return `<div class="card-enter bg-white dark:bg-gray-900 ${sizeClass} border-[1.5px] border-solid border-black dark:border-white flex flex-col items-center justify-center rounded-md shrink-0 ${winClass}"><span class="${txtClass} font-bold leading-none ${colorClass}">${formatRank(card.r)}</span><span class="${iconClass} leading-none mt-0 ${colorClass}">${SUIT_SYMBOLS[card.s]}</span></div>`; 
            },
            renderPlayerBox(p, isTurn, isHuman) { 
                const isDealer = this.state.dealerIndex === this.state.players.indexOf(p); 
                const isShowdown = this.state.stage === 4; 
                const showCards = isHuman || (isShowdown && !p.folded); 
                const boxStyle = isTurn && !isShowdown ? 'border-black dark:border-white shadow-md' : 'border-gray-200 dark:border-gray-800 opacity-80'; 
                const foldedStyle = p.folded || isShowdown ? 'grayscale opacity-40' : ''; 
                const myBorder = isHuman && !isShowdown ? 'border-b-[1.5px] border-b-black dark:border-b-white' : ''; 
                const cSize = isHuman ? 'large' : 'normal';
                const boxWidthClass = isHuman ? 'max-w-[5.5rem] sm:max-w-[7rem]' : 'max-w-[3.5rem] sm:max-w-[4.5rem]';
                
                return `<div class="relative flex flex-col items-center transition-all duration-300 ${foldedStyle} ${myBorder} w-full ${boxWidthClass} flex-1 min-w-0 z-10">${isDealer ? `<div class="absolute -top-1.5 -right-1.5 w-3.5 h-3.5 rounded-full border-[1px] border-black dark:border-white bg-white dark:bg-black text-black dark:text-white flex items-center justify-center text-[7px] font-bold z-20 shadow-sm">D</div>` : ''}${p.status ? `<div class="absolute -top-2 text-[6px] sm:text-[7px] uppercase tracking-widest font-mono bg-black text-white dark:bg-white dark:text-black px-1 py-0.5 whitespace-nowrap z-20 rounded-sm">${p.status}</div>` : ''}<div class="flex justify-center -space-x-1.5 sm:-space-x-2 mb-0.5 z-10 relative">${p.cards.length ? this.renderCard(p.cards[0], showCards, false, cSize) : this.renderCard(null, false, false, cSize)} ${p.cards.length ? this.renderCard(p.cards[1], showCards, false, cSize) : this.renderCard(null, false, false, cSize)}</div><div class="w-full border-[1px] p-0.5 text-center bg-white dark:bg-[#111] transition-all duration-300 ${boxStyle} relative z-10 rounded-sm"><div class="text-[6px] sm:text-[7px] font-mono opacity-50 uppercase tracking-widest truncate">${p.name}</div><div class="font-mono text-[8px] sm:text-[9px] font-bold leading-none truncate">${p.chips}</div>${p.rebuyCount > 0 ? `<div class="flex justify-center gap-[2px] mt-[2px] mb-[1px] flex-wrap w-full px-1">${'<div class="w-1 h-1 rounded-full bg-red-600/80 shadow-sm shrink-0"></div>'.repeat(p.rebuyCount)}</div>` : ''}${p.roundBet > 0 ? `<div class="text-[6px] sm:text-[7px] font-mono text-blue-600 dark:text-blue-400 mt-[1px] border-t-[1px] border-dashed border-gray-300 pt-[1px] truncate leading-none">Bet: ${p.roundBet}</div>` : '<div class="h-2 sm:h-2.5 mt-[1px]"></div>'}</div></div>`; 
            }
        };
        window.addEventListener('DOMContentLoaded', () => app.init());
    </script>
